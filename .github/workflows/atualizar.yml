name: Atualizar dados do Notion e publicar

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ler o Notion e o TMDB e gerar data.json
        if: ${{ env.NOTION_TOKEN != '' || env.TMDB_TOKEN != '' }}
        run: node scripts/build-data.mjs
      - name: Salvar data.json no repositório
        if: ${{ env.NOTION_TOKEN != '' || env.TMDB_TOKEN != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Atualiza dados do Notion" && git push)
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
