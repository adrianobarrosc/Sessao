<style>
:root {
  /* Layout: marquise com filtros no topo, grade de pôsteres abaixo, painel de detalhes à direita e conversa à esquerda */
  --bg: #0B0D12;
  --surface: #151922;
  --surface-2: #1E2330;
  --line: #2A3040;
  --ink: #F2EEE6;
  --muted: #9AA1B2;
  --accent: #E8B04B;
  --filmes: #FF5A4E;
  --streaming: #8B7CFF;
  --leitura: #4FD1A1;
  --games: #3FB8F5;
  --all: #E8B04B;
  --display: "Big Shoulders Display", "Oswald", "Arial Narrow", sans-serif;
  --body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body.locked { overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.wrap { max-width: 1312px; margin: 0 auto; padding: 0 24px; }

/* barra superior */
.topbar { border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-top: 14px; padding-bottom: 14px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img, .brand .logo { width: 40px; height: 40px; border-radius: 10px; display: block; }
.brand b { font: 700 24px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.sync { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--muted); font-size: 13px; }
#sources { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.src b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.src .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.src.ok .dot { background: var(--leitura); }
.src.wait .dot { background: var(--accent); animation: pulse 1.2s infinite; }
.src.bad .dot { background: var(--filmes); }
@keyframes pulse { 50% { opacity: .3; } }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; font-size: 13px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--bg); border-radius: 99px; padding: 9px 18px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
#install { padding: 6px 14px; font-size: 13px; }
#notice { margin-top: 14px; border: 1px solid var(--line); border-left: 4px solid var(--filmes); background: var(--surface); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
#notice p { margin: 0; }

/* marquise */
.hero { background: linear-gradient(180deg, #1A1420 0%, var(--bg) 100%); padding: 32px 0 24px; }
.hero .wrap { display: grid; gap: 18px; position: relative; }
.marquee { position: absolute; right: 24px; top: -6px; width: 230px; height: auto; pointer-events: none; }
@media (max-width: 1100px) { .marquee { display: none; } }
#media, .filters { position: relative; z-index: 1; }
@media (min-width: 1101px) { .hero h1, .eyebrow { max-width: calc(100% - 270px); } #genres { margin-right: 0; } }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font: 800 clamp(40px, 6vw, 64px)/.92 var(--display); margin: 0; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
#media { display: flex; flex-wrap: wrap; gap: 4px 28px; }
.seg { --c: var(--accent); background: none; border: 0; padding: 4px 2px 6px; display: inline-flex; align-items: baseline; gap: 8px; border-bottom: 3px solid transparent; color: var(--muted); }
.seg span:not(.ico) { font: 700 26px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.seg .ico { display: none; }
.seg small { font-size: 13px; font-variant-numeric: tabular-nums; }
.seg:hover { color: var(--ink); }
.seg[aria-checked="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.seg[aria-checked="true"] small { color: var(--accent); }
.filters { display: grid; gap: 12px; }
#genres { display: flex; flex-wrap: wrap; gap: 8px; max-height: 92px; overflow-y: auto; padding: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px 7px; font-size: 14px; font-weight: 500; }
.chip small { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; font-weight: 400; }
.chip:hover { border-color: var(--muted); }
.chip.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.chip.on small { color: inherit; opacity: .75; }
#genre-hint { font-size: 12px; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
#q, #where { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; min-width: 0; }
#q { flex: 1 1 260px; }
#where { flex: 0 1 320px; max-width: 100%; }
#q::placeholder { color: var(--muted); }

/* resultados */
.resbar { display: flex; justify-content: space-between; align-items: center; padding: 26px 0 18px; gap: 12px; }
#count { font: 700 26px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); }
#count b { color: var(--accent); font-variant-numeric: tabular-nums; }
#results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 32px 24px; }
.card { --c: var(--accent); text-align: left; display: flex; flex-direction: column; gap: 8px; background: none; border: 0; padding: 0; color: var(--ink); }
.art { position: relative; aspect-ratio: 2 / 3; border-radius: var(--radius); border: 1px solid var(--line); padding: 12px 14px 14px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  background: linear-gradient(180deg, var(--c) 0%, color-mix(in srgb, var(--c) 35%, #000) 55%, var(--bg) 100%); transition: transform .15s, box-shadow .15s; }
.card:hover .art, .card:focus-visible .art { transform: translateY(-3px); box-shadow: 0 14px 30px rgb(0 0 0 / .5), 0 0 0 1px var(--c); }
.kind { font: 600 11px/1.2 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.art .title { font: 800 clamp(22px, 2.2vw, 30px)/.95 var(--display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; padding-top: .14em; }
.card .sub { font-size: 13px; color: var(--muted); line-height: 1.35; }
.card .where { font-size: 12px; color: var(--muted); opacity: .8; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 2px 7px 3px; border-radius: 4px; background: color-mix(in srgb, var(--c, var(--accent)) 18%, transparent); color: var(--c, var(--accent)); border: 0; }
.tag.hit { background: var(--c); color: var(--bg); }
.tag.act:hover { outline: 1px solid var(--c); }
.why { font-size: 12px; color: var(--muted); font-style: italic; }
.flag { width: 8px; height: 8px; border-radius: 2px; display: inline-block; background: var(--ink); box-shadow: 0 0 0 2px rgb(0 0 0 / .35); }
.f-purple { background: #b79cff; } .f-blue { background: #7cc4ff; } .f-red { background: #ff8a80; } .f-green { background: #7ce0b0; } .f-gray { background: #c5c9d3; } .f-brown { background: #d6a36a; } .f-yellow { background: #f5d36b; } .f-orange { background: #ffae66; } .f-pink { background: #ff8fc8; }
.skeleton { aspect-ratio: 2 / 3; border-radius: var(--radius); background: linear-gradient(90deg, var(--surface), var(--surface-2), var(--surface)); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
.empty { grid-column: 1 / -1; text-align: center; padding: 40px 0; color: var(--muted); }
#more { margin: 28px auto 64px; display: block; }

/* pôster do TMDB por cima do degradê, quando existir */
.art.has-poster { background: linear-gradient(180deg, rgb(0 0 0 / .45) 0%, transparent 25%, transparent 45%, rgb(0 0 0 / .9) 100%), var(--poster) center / cover, linear-gradient(180deg, var(--c) 0%, color-mix(in srgb, var(--c) 35%, #000) 55%, var(--bg) 100%); }
.art.has-poster .title { text-shadow: 0 2px 12px rgb(0 0 0 / .8); font-size: clamp(18px, 1.8vw, 24px); }
.d-head.has-poster { background: linear-gradient(180deg, rgb(11 13 18 / .55) 0%, var(--bg) 100%), var(--poster) center 20% / cover; }

/* onde assistir */
.watch { display: grid; gap: 12px; justify-items: start; }
.watch h3 { margin: 0; }
.wg { display: grid; gap: 6px; }
.wl { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.provs { display: flex; flex-wrap: wrap; gap: 8px; }
.prov { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px 5px 5px; font-size: 14px; font-weight: 500; }
.prov img { width: 28px; height: 28px; border-radius: 6px; display: block; }
.attr { font-size: 11.5px; color: var(--muted); margin: 0; max-width: 60ch; }
.attr a { color: var(--accent); }

/* painel de detalhes */
#detail { position: fixed; inset: 0; z-index: 20; }
#scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .6); }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: -20px 0 40px rgb(0 0 0 / .5); }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; border-bottom: 1px solid var(--line); }
.sheet-bar .link { color: var(--muted); }
#detail-body { flex: 1; overflow-y: auto; display: grid; gap: 22px; align-content: start; grid-auto-rows: max-content; padding-bottom: 40px; }
#detail-body > :not(.d-head) { margin: 0 28px; }
.d-head { --c: var(--accent); display: grid; gap: 10px; padding: 80px 28px 24px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 40%, #000) 0%, var(--bg) 100%); }
.d-head .kind { color: var(--c); }
.d-head h2 { font: 800 clamp(40px, 6vw, 60px)/.92 var(--display); margin: 0; padding-top: .12em; text-transform: uppercase; text-wrap: balance; overflow-wrap: break-word; hyphens: auto; }
.d-head h2.long { font-size: clamp(30px, 4vw, 40px); line-height: .98; }
.d-head .orig { margin: 0; color: var(--muted); }
.d-syn { font-size: 16px; max-width: 62ch; }
.d-syn.ext p { margin: 0 0 10px; }
.d-syn.ext .attr { margin-top: 4px; }
.d-syn.duplo { display: grid; gap: 14px; }
.syn-bloco h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
.syn-bloco h3 span { text-transform: none; letter-spacing: 0; color: var(--accent); }
.syn-bloco p { margin: 0 0 8px; }
.syn-bloco.atual { border-left: 3px solid var(--accent); padding-left: 12px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.facts div { background: var(--surface); padding: 10px 14px; }
.facts dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 3px 0 0; font-size: 14px; }
.notion { justify-self: start; }
section h3 { font: 700 26px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 14px; }
.rel { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; }
.rel .art .title { font-size: 22px; }

/* conversa */
#chat-fab { text-decoration: none; position: fixed; right: 24px; bottom: 24px; z-index: 12; background: var(--ink); border-color: var(--ink); color: var(--bg); padding: 13px 22px; box-shadow: 0 10px 30px rgb(0 0 0 / .5); }
body.chat-open #chat-fab { display: none; }
#chat { position: fixed; left: 0; top: 0; bottom: 0; width: min(420px, 100%); z-index: 15; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: 20px 0 40px rgb(0 0 0 / .4); }
@media (min-width: 1100px) { body.chat-open { padding-left: 420px; } }
.chat-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.chat-bar h2 { font: 700 26px/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 2px 0 0; }
.chat-bar .link { color: var(--muted); }
#chat-log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 92%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 6px 0; padding-left: 18px; display: grid; gap: 8px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--bg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.err { box-shadow: inset 0 0 0 1px var(--filmes); }
.msg .note { font-size: 12.5px; color: var(--muted); font-style: italic; margin-top: 6px; }
.thinking { color: var(--muted); animation: pulse 1.2s infinite; }
.pick { --c: var(--accent); display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--c); color: var(--ink); background: color-mix(in srgb, var(--c) 20%, transparent); border-radius: 6px; padding: 1px 8px 2px; margin: 1px 2px; font-weight: 600; font-size: 13.5px; }
.pick:hover { background: color-mix(in srgb, var(--c) 35%, transparent); }
.hello p { margin: 0 0 12px; color: var(--muted); }
.starters { display: grid; gap: 8px; }
.starter { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
.starter:hover { border-color: var(--accent); }
#chat-form { display: flex; gap: 10px; padding: 14px 20px 10px; border-top: 1px solid var(--line); align-items: flex-end; }
#chat-input { flex: 1; resize: none; min-height: 46px; max-height: 140px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 14px; }
#chat-form .btn { border-radius: 12px; }
.chat-foot { font-size: 11.5px; color: var(--muted); padding: 0 20px 14px; margin: 0; }

/* cores por mídia (depois das regras base) */
.m-filmes { --c: var(--filmes); } .m-streaming { --c: var(--streaming); } .m-leitura { --c: var(--leitura); } .m-games { --c: var(--games); }
.card.m-filmes, .d-head.m-filmes, .pick.m-filmes { --c: var(--filmes); }
.card.m-streaming, .d-head.m-streaming, .pick.m-streaming { --c: var(--streaming); }
.card.m-leitura, .d-head.m-leitura, .pick.m-leitura { --c: var(--leitura); }
.card.m-games, .d-head.m-games, .pick.m-games { --c: var(--games); }

@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  #results { grid-template-columns: repeat(2, 1fr); gap: 24px 14px; }
  .seg span:not(.ico) { font-size: 22px; }
  #genres { max-height: 84px; }
  #chat-fab { right: 16px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

const GAME_ONLY = new Set(['RPG','Tiro','Plataforma','Luta','Corrida','Estratégia','Puzzle','Simulação','Party & casual','Roguelike','Sobrevivência']);
const BOOK_ONLY = new Set(['Ficção literária','Ensaio & não ficção','Negócios & produtividade','Bem-estar & estilo de vida','Quadrinhos','Clássicos']);

function decode(s) {
  return s.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
}
function clean(s) {
  if (!s) return '';
  s = s.replace(/\(\s*\[[^\]]*\]\([^)]*\)\s*\)/g, '');      // "([Wikipedia](url))"
  s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');            // [txt](url)
  s = s.replace(/<br\s*\/?>/gi, ' ');
  s = s.replace(/<[^>]+>/g, '');
  s = s.replace(/\\([*_|#\[\]()])/g, '$1');
  s = s.replace(/\*\*/g, '');
  return decode(s).replace(/\s+/g, ' ').trim();
}
const norm = s => clean(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

function splitPipeRow(line) {
  let t = line.trim();
  if (t.startsWith('|')) t = t.slice(1);
  if (t.endsWith('|')) t = t.slice(0, -1);
  const cells = []; let cur = ''; let depth = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (c === '\\' && t[i + 1] === '|') { cur += '|'; i++; continue; }
    if (c === '<') depth++; else if (c === '>') depth = Math.max(0, depth - 1);
    if (c === '|' && depth === 0) { cells.push(cur); cur = ''; } else cur += c;
  }
  cells.push(cur);
  return cells.map(x => x.trim());
}

function rowsFromHtmlTable(block) {
  const rows = [];
  const trRe = /<tr([^>]*)>([\s\S]*?)<\/tr>/g; let m;
  while ((m = trRe.exec(block))) {
    const cells = []; const tdRe = /<t[dh][^>]*>([\s\S]*?)<\/t[dh]>|<t[dh][^>]*\/>/g; let c;
    while ((c = tdRe.exec(m[2]))) cells.push((c[1] || '').trim());
    const color = (m[1].match(/color="([^"]+)"/) || [])[1] || null;
    rows.push({ cells, color });
  }
  return rows;
}

/** Converte o texto de uma página em blocos ordenados: headings, rótulos e tabelas */
function tokenize(text) {
  let t = text;
  const ci = t.indexOf('<content>'); if (ci >= 0) t = t.slice(ci + 9);
  const ce = t.lastIndexOf('</content>'); if (ce >= 0) t = t.slice(0, ce);
  // <h1 ...>\n texto \n</h1>  ->  "# texto"
  t = t.replace(/<h([1-4])[^>]*>([\s\S]*?)<\/h\1>/g, (_, n, inner) => '\n' + '#'.repeat(+n) + ' ' + clean(inner) + '\n');
  const toks = [];
  // separa tabelas HTML primeiro
  const parts = t.split(/(<table[\s\S]*?<\/table>)/g);
  for (const part of parts) {
    if (part.startsWith('<table')) { toks.push({ type: 'table', rows: rowsFromHtmlTable(part) }); continue; }
    const lines = part.split('\n');
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) { const txt = clean(h[2]); if (txt) toks.push({ type: 'h', level: h[1].length, text: txt }); continue; }
      if (/^\s*\|/.test(line)) {
        const block = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) block.push(lines[i++]);
        i--;
        const rows = block.filter(l => !/^\s*\|?\s*:?-{2,}/.test(l)).map(l => ({ cells: splitPipeRow(l), color: null }));
        toks.push({ type: 'table', rows });
        continue;
      }
      if (/<u>/.test(line)) {
        const txt = clean(line).replace(/:\s*$/, '');
        if (txt && txt.length <= 40) toks.push({ type: 'label', text: txt });
      }
    }
  }
  return toks;
}

const TITLE_HDR = /^(t[íi]tulo( no brasil| em portugu[êe]s| da s[ée]rie)?|jogo.*|nome( original)?|hist[óo]ria)$/i;
const GENRE_HDR = /g[êe]nero/i;
const SKIP_DETAIL_HDR = /^n[ºo°]\.?$/i;

function parsePage(src, text, pageUrl) {
  const toks = tokenize(text);
  const items = [];
  const heads = [];          // heads[level-1]
  let label = '';
  for (const tk of toks) {
    if (tk.type === 'h') { heads[tk.level - 1] = tk.text; heads.length = tk.level; label = ''; continue; }
    if (tk.type === 'label') { label = tk.text; continue; }
    if (tk.type !== 'table' || tk.rows.length < 2) continue;
    const header = tk.rows[0].cells.map(clean);
    const hs = heads.filter(Boolean);
    let path = src.pathMode === 'last' ? (hs.length ? [hs[hs.length - 1]] : []) : hs.slice();
    if (label) path = path.concat(label);
    let titleIdx = header.findIndex(h => /^t[íi]tulo( no brasil| em portugu[êe]s)$/i.test(h));
    if (titleIdx < 0) titleIdx = header.findIndex(h => TITLE_HDR.test(h));
    let last = null;
    for (const row of tk.rows.slice(1)) {
      const raw = row.cells;
      const nonEmpty = raw.map((c, i) => [i, c]).filter(([, c]) => clean(c));
      if (!nonEmpty.length) continue;
      // linha de sinopse: uma única célula preenchida, em itálico
      if (nonEmpty.length === 1 && last && (/<i>/.test(nonEmpty[0][1]) || nonEmpty[0][0] !== titleIdx)) {
        const syn = clean(nonEmpty[0][1]).replace(/\s*\(Repetido do n[ºo] ?\d+\.?\)\s*$/i, '');
        last.synopsis = last.synopsis ? last.synopsis : syn;
        continue;
      }
      // título: célula em negrito, senão a coluna de título
      let ti = titleIdx >= 0 && clean(raw[titleIdx]) ? titleIdx : raw.findIndex(c => /^\s*<b>/.test(c));
      if (ti < 0) ti = 0;
      const title = clean(raw[ti]);
      if (!title) continue;
      const fields = [];
      let genreText = '';
      header.forEach((h, i) => {
        if (i === ti || !h || SKIP_DETAIL_HDR.test(h)) return;
        const v = clean(raw[i] || '');
        if (!v) return;
        fields.push([h, v]);
        if (GENRE_HDR.test(h)) genreText += ' / ' + v;
      });
      // subtítulo: original / autor / diretor
      const pick = re => (fields.find(([h]) => re.test(h)) || [])[1] || '';
      const original = pick(/t[íi]tulo original|nome original/i);
      const creator = pick(/autor|diretor|criador/i);
      const year = pick(/^ano$/i);
      const item = {
        media: src.key, title, original: original && norm(original) !== norm(title) ? original : '',
        creator, year, path, fields, synopsis: '', genreText: genreText.replace(/^ \/ /, ''),
        flag: row.color, url: pageUrl,
      };
      items.push(item); last = item;
    }
  }
  return dedupe(items).map(it => Object.assign(it, { genres: canonGenres(it) }));
}

function dedupe(items) {
  const map = new Map();
  for (const it of items) {
    const k = it.media + '|' + norm(it.title);
    if (!map.has(k)) { it.lists = [it.path.join(' › ')]; map.set(k, it); continue; }
    const a = map.get(k);
    const p = it.path.join(' › ');
    if (!a.lists.includes(p)) a.lists.push(p);
    if (!a.synopsis && it.synopsis) a.synopsis = it.synopsis;
    for (const f of it.fields) if (!a.fields.some(([h]) => h === f[0])) a.fields.push(f);
    if (!a.genreText) a.genreText = it.genreText;
  }
  return [...map.values()];
}

function canonGenres(it) {
  const allowed = g => it.media === 'games' ? !BOOK_ONLY.has(g) : it.media === 'leitura' ? !GAME_ONLY.has(g) : !GAME_ONLY.has(g) && !BOOK_ONLY.has(g);
  const match = txt => GENRES.filter(([g, re]) => allowed(g) && re.test(txt)).map(([g]) => g);
  let gs = match(it.genreText);
  if (it.media === 'leitura' && /hqs/i.test(it.path.join(' '))) gs.push('Quadrinhos');
  if (!gs.length) gs = match(it.fields.map(f => f[1]).join(' / ') + ' / ' + it.path.join(' / '));
  // Tiro já implica Ação em games; evita duplicar "Ação" vindo só de "shooter"
  return [...new Set(gs)];
}

if (typeof module !== 'undefined') module.exports = { parsePage, SOURCES, tokenize, GENRES };

const NOTION = 'Notion';
const TOOL = 'notion-fetch';
const LS_KEY = 'consulta-cultural-v1';
const MEDIA = Object.fromEntries(SOURCES.map(s => [s.key, s]));

const S = {

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const uid = it => it.media + '|' + fold(it.title);

function allItems() { return SOURCES.flatMap(s => S.items[s.key] || []); }
function scope() { return S.media === 'all' ? allItems() : (S.items[S.media] || []); }

/* ---------- persistência leve ---------- */
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem(LS_KEY + ':prefs') || '{}');
    if (p.media) S.media = p.media;
    if (Array.isArray(p.genres)) S.genres = p.genres;
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(LS_KEY + ':prefs', JSON.stringify({ media: S.media, genres: S.genres })); } catch (e) {}
}
function loadSnapshot() {
  try {
    const snap = JSON.parse(localStorage.getItem(LS_KEY + ':data') || 'null');
    if (!snap) return;
    for (const s of SOURCES) if (snap[s.key]) {
      S.items[s.key] = snap[s.key].items;
      S.status[s.key] = { state: 'cached', storedAt: snap[s.key].storedAt };
    }
  } catch (e) {}
}
function saveSnapshot() {
  try {
    const snap = {};
    for (const s of SOURCES) if (S.items[s.key]) snap[s.key] = { items: S.items[s.key], storedAt: S.status[s.key]?.storedAt || Date.now() };
    localStorage.setItem(LS_KEY + ':data', JSON.stringify(snap));
  } catch (e) {}
}

/* ---------- leitura do Notion ---------- */
function textFromResult(result) {
  let p = result && result.payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return p; } }
  if (p && typeof p.text === 'string') return p.text;
  const block = (result?.content || []).find(b => b.type === 'text');
  if (block) { try { const j = JSON.parse(block.text); if (j.text) return j.text; } catch (e) {} return block.text; }
  return '';
}

const DENIALS = new Set(['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest', 'selection_required', 'server_not_found', 'not_granted', 'capability_disabled', 'capability_removed']);

function onEvent(src, ev) {
  if (ev.type === 'data') {
    const text = textFromResult(ev.result);
    let items = [];
    try { items = parsePage(src, text, 'https://www.notion.so/' + src.id); } catch (e) { console.error(e); }
    if (!items.length) {
      S.status[src.key] = { ...S.status[src.key], state: 'error', code: 'parse', msg: 'A página foi lida, mas nenhuma tabela foi reconhecida.' };
    } else {
      S.items[src.key] = items;
      S.status[src.key] = { state: ev.result.cache?.revalidating ? 'refreshing' : 'ok', storedAt: ev.result.cache?.storedAt || Date.now() };
      saveSnapshot();
    }
  } else {
    const err = ev.error || {};
    const code = err.code || 'upstream_error';
    if (DENIALS.has(code)) { delete S.items[src.key]; }
    S.status[src.key] = { ...S.status[src.key], state: DENIALS.has(code) ? 'denied' : 'error', code, msg: err.message || '' };
  }
  renderAll();
}

async function connect() {
  let mcp = null;
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { mcp = null; }
  S.mcp = mcp;
  if (!mcp && await loadStatic()) return;
  if (!mcp) {
    for (const s of SOURCES) if (!S.items[s.key]) S.status[s.key] = { state: 'denied', code: 'no_mcp' };
    renderAll();
    return;
  }
  for (const s of SOURCES) {
    if (!S.items[s.key]) S.status[s.key] = { state: 'loading' };
    mcp.watchTool(NOTION, TOOL, { id: s.id }, ev => onEvent(s, ev),
      { cache: { staleTime: 6 * 3600e3, gcTime: 7 * 86400e3 } });
  }
  renderAll();
}

async function loadStatic() {
  try {
    const r = await fetch('data.json', { cache: 'no-cache' });
    if (!r.ok) return false;
    const j = await r.json();
    const at = Date.parse(j.generatedAt) || Date.now();
    let any = false;
    for (const s of SOURCES) {
      const items = j.sources?.[s.key]?.items;
      if (Array.isArray(items) && items.length) { S.items[s.key] = items; S.status[s.key] = { state: 'ok', storedAt: at }; any = true; }
      else S.status[s.key] = { state: 'error', code: 'static_empty' };
    }
    S.static = true;
    renderAll();
    return any;
  } catch (e) { return false; }
}

async function refreshAll() {
  if (!S.mcp) return;
  for (const s of SOURCES) S.status[s.key] = { ...S.status[s.key], state: 'refreshing' };
  renderStatus();
  try { await S.mcp.invalidate(NOTION, TOOL); } catch (e) {}
}

async function askPermission() {
  if (!S.mcp) return;
  for (const s of SOURCES) {
    try {
      const r = await S.mcp.callTool(NOTION, TOOL, { id: s.id }, { cache: { staleTime: 6 * 3600e3, gcTime: 7 * 86400e3 } });
      onEvent(s, { type: 'data', result: r });
    } catch (err) { onEvent(s, { type: 'error', error: err }); if (DENIALS.has(err.code)) break; }
  }
}

/* ---------- filtros ---------- */
function genreCounts(items) {
  const c = new Map();
  for (const it of items) for (const g of it.genres) c.set(g, (c.get(g) || 0) + 1);
  return [...c.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt'));
}
function whereOptions(items) {
  const c = new Map();
  for (const it of items) for (const l of it.lists) if (l) c.set(l, (c.get(l) || 0) + 1);
  return [...c.entries()].sort((a, b) => a[0].localeCompare(b[0], 'pt'));
}
function filtered() {
  const q = fold(S.q).trim();
  return scope().filter(it =>
    S.genres.every(g => it.genres.includes(g)) &&
    (!S.where || it.lists.includes(S.where)) &&
    (!q || fold([it.title, it.original, it.creator, it.genreText, it.synopsis, it.lists.join(' ')].join(' ')).includes(q))
  );
}

/* ---------- relacionados ---------- */
let IDF = new Map();
function buildIdf() {
  const all = allItems(); const df = new Map();
  for (const it of all) for (const g of it.genres) df.set(g, (df.get(g) || 0) + 1);
  IDF = new Map([...df].map(([g, n]) => [g, Math.log(1 + all.length / n)]));
}
function similarity(a, b) {
  const shared = a.genres.filter(g => b.genres.includes(g));
  let s = shared.reduce((acc, g) => acc + (IDF.get(g) || 1), 0);
  if (s) s /= Math.sqrt(a.genres.length * b.genres.length);
  if (a.creator && b.creator && fold(a.creator) === fold(b.creator)) s += 1.5;
  if (a.media === b.media && a.lists.some(l => b.lists.includes(l))) s += 0.15;
  return { s, shared };
}
function related(it) {
  const scored = allItems().filter(o => uid(o) !== uid(it))
    .map(o => ({ o, ...similarity(it, o) })).filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s);
  return {
    same: scored.filter(x => x.o.media === it.media).slice(0, 6),
    other: scored.filter(x => x.o.media !== it.media).slice(0, 6),
  };
}

  if (!ms) return '';
  const d = new Date(ms);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function renderStatus() {

  const groups = [['Assinatura', w.flatrate], ['Grátis', w.free], ['Grátis com anúncios', w.ads], ['Aluguel', w.rent], ['Compra', w.buy]].filter(([, l]) => l && l.length);

function duplo(it) {
  if (it.media !== 'streaming' || !(it.path || []).some(p => /temporada adiantada/i.test(p))) return '';
  const temp = (it.fields.find(([k]) => /temporada atual/i.test(k)) || [])[1] || '';
  const ov = it.tmdb?.overview || '';
  const geral = ov
    ? `<section class="syn-bloco"><h3>Sinopse da série</h3>${ov.split('\n').filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('')}<p class="attr">Sinopse: TMDB${it.tmdb.overviewTraduzido ? ' · traduzida para o português' : it.tmdb.overviewLang === 'en' ? ' (em inglês)' : ''}</p></section>`
    : '';
  const tempTxt = (it.synopsis || '').replace(/^\s*\d+\s*[ªºa]?\s*temporada\s*[:–-]\s*/i, '').replace(/^./, c => c.toUpperCase());
  const atual = tempTxt
    ? `<section class="syn-bloco atual"><h3>Temporada onde eu estou${temp ? ` <span>· ${esc(/temporada/i.test(temp) ? temp : temp + ' temporada')}</span>` : ''}</h3><p>${esc(tempTxt)}</p></section>`
    : '';
  return geral || atual ? `<div class="d-syn duplo">${geral}${atual}</div>` : '';
}

const CHAT = { turns: [], ctl: null, sample: null, busy: false, ids: new Map(), byId: new Map() };
const PREFIX = { filmes: 'F', streaming: 'S', leitura: 'L', games: 'G' };

function catalogText() {
  CHAT.ids.clear(); CHAT.byId.clear();
  const lines = [];
  for (const s of SOURCES) {
    (S.items[s.key] || []).forEach((it, i) => {
      const id = PREFIX[s.key] + (i + 1);
      CHAT.ids.set(uid(it), id); CHAT.byId.set(id, it);
      lines.push([id, it.title, it.original, it.creator, it.year, it.genres.join(', '), it.lists.join('; ')].filter(Boolean).join(' | '));
    });
  }
  return lines.join('\n');
}

function rulesTurn() {
  const filtros = [
    S.media === 'all' ? 'todas as mídias' : MEDIA[S.media].label,
    S.genres.length ? 'gêneros: ' + S.genres.join(' + ') : 'qualquer gênero',
    S.where ? 'lista/plataforma: ' + S.where : '',
  ].filter(Boolean).join('; ');
  const counts = SOURCES.map(s => `${s.label}: ${(S.items[s.key] || []).length}`).join(', ');
  return `Você é um curador pessoal de cultura e entretenimento. Converse em português do Brasil, de forma direta e calorosa.
Seu trabalho: sugerir o que a pessoa deve consumir AGORA (filmes, séries, livros/HQs ou jogos), escolhendo SOMENTE títulos do catálogo pessoal dela abaixo, que vem do Notion.

Regras:
- Sempre que citar um título do catálogo, escreva o código dele entre colchetes duplos, assim: [[F12]]. A página transforma o código num botão com o nome do título; não repita o nome logo depois do código.
- Sugira de 3 a 5 opções por resposta, cada uma com uma frase sobre por que combina com o pedido (clima, duração, gênero, plataforma).
- Se a pessoa pedir algo que não existe no catálogo, diga isso e ofereça o mais próximo que existe.
- Leve em conta os filtros que a pessoa tem marcados na página (abaixo), a menos que ela peça outra coisa.
- Use a ferramenta de sinopses quando precisar saber do enredo para decidir, se ela estiver disponível.
- Respostas curtas: no máximo uns 150 palavras. Pode usar listas com "- ".

Filtros marcados agora: ${filtros}.
Tamanho do catálogo: ${counts}.

Catálogo (código | título | título original | autor/diretor | ano | gêneros | onde está no Notion):
${catalogText()}`;
}

function renderRich(text) {
  let h = esc(text);
  h = h.replace(/\[\[([FSLG]\d+)\]\]/g, (m, id) => {
    const it = CHAT.byId.get(id);
    if (!it) return '';
    return `<button class="pick m-${it.media}" data-uid="${esc(uid(it))}"><span aria-hidden="true">${MEDIA[it.media].icon}</span>${esc(it.title)}</button>`;
  });
  h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  const out = []; let inList = false;
  for (const line of h.split('\n')) {
    const li = line.match(/^\s*[-•*]\s+(.*)$/) || line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + li[1] + '</li>'); continue; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (line.trim()) out.push('<p>' + line + '</p>');
  }
  if (inList) out.push('</ul>');
  return out.join('');
}

const CHAT_ERR = {
  not_granted: 'A conversa precisa da sua permissão para usar o Claude. Recarregue a página para ser perguntado de novo.',
  sampling_disabled: 'O Claude não está disponível para esta conta.',
  rate_limited: 'Muitas mensagens em pouco tempo, ou o limite de uso foi atingido. Tente de novo daqui a pouco.',
  session_expired: 'Sua sessão expirou. Entre de novo no claude.ai.',
  prompt_too_large: 'A conversa ficou longa demais. Clique em "Nova conversa".',
  refused: 'O Claude não respondeu a esse pedido. Tente reformular.',
  empty_completion: 'O Claude não devolveu texto. Tente pedir de outro jeito.',
};

function renderChat() {
  const log = $('#chat-log');
  if (!CHAT.turns.length) {
    log.innerHTML = `<div class="hello"><p>Diga o que você está a fim e eu escolho no seu catálogo do Notion.</p>
      <div class="starters">${[
        'Um filme leve para hoje à noite, até 2 horas',
        'Uma série curta de suspense para maratonar no fim de semana',
        'Um livro de não ficção para entender o mundo de hoje',
        'Um jogo cooperativo para jogar a dois no PlayStation',
        'Algo parecido com o que eu marquei nos filtros, mas em outra mídia',
      ].map(t => `<button class="starter">${esc(t)}</button>`).join('')}</div></div>`;
  } else {
    log.innerHTML = CHAT.turns.map(t => t.role === 'user'
      ? `<div class="msg me">${esc(t.content)}</div>`
      : `<div class="msg ai ${t.error ? 'err' : ''}">${t.pending ? '<span class="thinking">Pensando…</span>' : renderRich(t.content)}${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}</div>`).join('');
  }
  log.scrollTop = log.scrollHeight;
  $('#chat-send').hidden = CHAT.busy;
  $('#chat-stop').hidden = !CHAT.busy;
  $('#chat-reset').hidden = !CHAT.turns.length || CHAT.busy;
}

async function sendChat(text) {
  text = text.trim();
  if (!text || CHAT.busy) return;
  if (!allItems().length) { CHAT.turns.push({ role: 'user', content: text }, { role: 'assistant', content: 'Ainda estou esperando os dados do Notion chegarem. Tente de novo em instantes.', error: true }); renderChat(); return; }
  if (!CHAT.sample) { CHAT.turns.push({ role: 'user', content: text }, { role: 'assistant', content: 'A conversa só funciona com a página aberta no claude.ai.', error: true }); renderChat(); return; }
  CHAT.turns.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '', pending: true };
  CHAT.turns.push(reply);
  CHAT.busy = true; $('#chat-input').value = ''; renderChat();

  const history = CHAT.turns.filter(t => t !== reply && !t.error && t.content).slice(-12).map(t => ({ role: t.role, content: t.content }));
  while (history.length && history[0].role !== 'user') history.shift();
  const input = [{ role: 'user', content: rulesTurn() }, ...history];

  const caps = await CHAT.sample.limits().catch(() => null);
  const opts = {
    cache: false,
    signal: (CHAT.ctl = new AbortController()).signal,
    onText: ({ text }) => { reply.pending = false; reply.content = text; renderChat(); },
  };
  if (caps && caps.tools) {
    delete opts.cache;
    opts.tools = [{
      name: 'sinopses',
      description: 'Devolve a sinopse e os detalhes (duração, plataforma, avaliação etc.) dos títulos pedidos, pelos códigos do catálogo. Use para decidir entre opções quando o enredo importa.',
      inputSchema: { type: 'object', properties: { codigos: { type: 'array', items: { type: 'string' }, description: 'Códigos como F12, L40' } }, required: ['codigos'] },
      execute: ({ codigos }) => (Array.isArray(codigos) ? codigos : []).slice(0, 12).map(c => {
        const it = CHAT.byId.get(String(c));
        return it ? { codigo: c, titulo: it.title, sinopse: it.synopsis || '(sem sinopse)', detalhes: Object.fromEntries(it.fields) } : { codigo: c, erro: 'código inexistente' };
      }),
    }];
  }
  try {
    const r = await CHAT.sample(input, opts);
    reply.content = r.text; reply.pending = false;
    if (r.truncated) reply.note = 'A resposta foi cortada. Peça menos opções de cada vez.';
  } catch (e) {
    reply.pending = false;
    if (e.code === 'cancelled') { reply.content = e.text || ''; reply.note = 'Interrompido.'; if (!reply.content) reply.error = true; }
    else {
      reply.content = e.code === 'refused' ? '' : (e.text || '');
      reply.note = CHAT_ERR[e.code] || 'Não consegui responder agora. Tente enviar de novo.';
      reply.error = !reply.content;
      if (e.code === 'not_granted' || e.code === 'sampling_disabled') CHAT.sample = null;
    }
    if (!reply.content) reply.content = ' ';
  } finally {
    CHAT.busy = false; CHAT.ctl = null; renderChat();
  }
}

function bindChat() {
  const open = () => { $('#chat').hidden = false; document.body.classList.add('chat-open'); renderChat(); $('#chat-input').focus(); };
  const close = () => { $('#chat').hidden = true; document.body.classList.remove('chat-open'); };
  $('#chat-fab').onclick = open;
  $('#chat-close').onclick = close;
  $('#chat-form').addEventListener('submit', e => { e.preventDefault(); sendChat($('#chat-input').value); });
  $('#chat-input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });
  $('#chat-stop').onclick = () => CHAT.ctl?.abort();
  $('#chat-reset').onclick = () => { CHAT.turns = []; renderChat(); };
  $('#chat-log').addEventListener('click', e => {
    const s = e.target.closest('.starter'); if (s) { sendChat(s.textContent); return; }
    const p = e.target.closest('.pick[data-uid]'); if (p) { S.open = []; openItem(p.dataset.uid); }
  });
  (async () => {
    try { CHAT.sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch (e) { CHAT.sample = null; }
    const fab = $('#chat-fab');
    if (CHAT.sample) { fab.hidden = false; return; }
    if (!window.claude) {
      // fora do claude.ai: o botão leva para a versão com conversa
      const a = document.createElement('a');
      a.id = 'chat-fab'; a.className = 'btn'; a.href = 'https://claude.ai/artifact/JKApuri2Rf3JsZaavCdBk5';
      a.target = '_blank'; a.rel = 'noopener'; a.textContent = '💬 Conversar com o Claude ↗';
      a.title = 'Abre a versão desta página no claude.ai, onde a conversa funciona';
      fab.replaceWith(a);
    }
  })();
}
bindChat();


/* ---------- App instalável (só no site do GitHub) ---------- */
(function () {
  const onSite = /github\.io$/.test(location.hostname);
  if (!onSite || !('serviceWorker' in navigator)) return;
  try { navigator.serviceWorker.register('sw.js'); } catch (e) {}
  let deferred = null;
  const btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; btn.hidden = true;
  });
  window.addEventListener('appinstalled', () => { btn.hidden = true; });
})();

</script>
